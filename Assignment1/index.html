<!DOCTYPE html>
<html>
<head>
    <title>HTML CSS JS Quiz</title>

    <!-- Connect CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Start Page -->
    <div class="box" id="start">

        <h2>HTML CSS JS Quiz</h2>

        <input type="text" id="name" placeholder="Enter Name">

        <input type="text" id="roll" placeholder="Enter Roll No.">

        <input type="text" id="section" placeholder="Enter Section">

        <button onclick="startQuiz()">Start Quiz</button>

    </div>


    <!-- Quiz Page -->
    <div class="box" id="quiz">

        <div id="timer">20:00</div>

        <h3 id="qno">Question 1 of 5</h3>

        <h3 id="question"></h3>


        <!-- Option 1 -->
        <label>
            <input type="radio" name="answer" id="answer0">
            <span id="text0"></span>
        </label>


        <!-- Option 2 -->
        <label>
            <input type="radio" name="answer" id="answer1">
            <span id="text1"></span>
        </label>


        <!-- Option 3 -->
        <label>
            <input type="radio" name="answer" id="answer2">
            <span id="text2"></span>
        </label>


        <!-- Option 4 -->
        <label>
            <input type="radio" name="answer" id="answer3">
            <span id="text3"></span>
        </label>


        <button onclick="nextQuestion()">Next</button>

    </div>


    <!-- Connect JavaScript -->
    <script src="script.js"></script>

</body>
</html>
